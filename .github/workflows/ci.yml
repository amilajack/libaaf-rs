name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: python3 tooling/verify.py native
  differential-and-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: python3 tooling/verify.py reference-and-wasm
